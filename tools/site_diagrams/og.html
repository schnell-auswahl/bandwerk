<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/tokens.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--sans)}
.wrap{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:56px 64px}
.eb{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fx-io)}
h1{margin:22px 0 0;font-weight:900;font-stretch:112%;letter-spacing:-.035em;line-height:.9;font-size:100px}
h1 span{color:var(--fx-xover)}
.sub{margin-top:24px;font-size:26px;font-weight:600;max-width:620px;line-height:1.3}
.logo{position:absolute;left:64px;bottom:76px;display:flex;align-items:center;gap:14px;font-weight:900;font-stretch:125%;font-size:26px;text-transform:uppercase;letter-spacing:-.03em}
.logo i{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;width:34px;height:34px}
.logo b:nth-child(1){background:var(--fx-comp)}.logo b:nth-child(2){background:var(--fx-loop)}.logo b:nth-child(3){background:var(--fx-oct)}.logo b:nth-child(4){background:var(--fx-drive)}
.logo em{font-style:normal;color:var(--mute)}
.pedal{position:absolute;right:64px;top:40px;height:520px}
.key{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex}.key i{flex:1}
</style></head><body><div class="wrap">
<div class="eb">Multiband bass pedal firmware</div>
<h1>Split your<br>bass in<br><span>two.</span></h1>
<p class="sub">For Daisy Seed pedals: Hothouse and FunBox. Crossover, compressors, FX loop, octaver, drive.</p>
<div class="logo"><i><b></b><b></b><b></b><b></b></i>Bandwerk</div>
<img class="pedal" src="../img/pedal.svg" alt="">
<div class="key"><i style="background:var(--fx-io)"></i><i style="background:var(--fx-xover)"></i><i style="background:var(--fx-comp)"></i><i style="background:var(--fx-loop)"></i><i style="background:var(--fx-oct)"></i><i style="background:var(--fx-drive)"></i></div>
</div></body></html>
