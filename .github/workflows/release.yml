name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Build libDaisy and DaisySP
        run: |
          make -C lib/HothouseExamples/libDaisy -j"$(nproc)"
          make -C lib/HothouseExamples/DaisySP -j"$(nproc)"

      - name: Release builds (BM_DEV=0, BM_REMOTE=1, BOOT_SRAM), Hothouse and FunBox
        run: |
          set -eu
          mkdir -p dist
          boot=dsy_bootloader_v6_2-intdfu-2000ms.bin
          for board in hothouse funbox; do
            make -C firmware release BOARD=$board
            cp firmware/build/bass_multiband.bin "dist/bandwerk-${board}-${GITHUB_REF_NAME}.bin"
          done
          cp "lib/HothouseExamples/libDaisy/core/${boot}" "dist/${boot}"
          cp lib/HothouseExamples/libDaisy/LICENSE dist/LICENSE-libDaisy.txt
          (cd dist && for f in bandwerk-*-"${GITHUB_REF_NAME}".bin; do sha256sum "$f" > "$f.sha256"; done && sha256sum "${boot}" > "${boot}.sha256")

      - name: Attach the firmware to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bandwerk-hothouse-*.bin
            dist/bandwerk-hothouse-*.bin.sha256
            dist/bandwerk-funbox-*.bin
            dist/bandwerk-funbox-*.bin.sha256
            dist/dsy_bootloader_*.bin
            dist/dsy_bootloader_*.bin.sha256
            dist/LICENSE-libDaisy.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}   # v0.1.0-beta etc.
