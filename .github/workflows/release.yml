name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Build libDaisy and DaisySP
        run: |
          make -C lib/HothouseExamples/libDaisy -j"$(nproc)"
          make -C lib/HothouseExamples/DaisySP -j"$(nproc)"

      - name: Release build (BM_DEV=0, BM_REMOTE=1, BOOT_SRAM)
        run: |
          set -eu
          make -C firmware release
          mkdir -p dist
          app="bass_multiband-${GITHUB_REF_NAME}.bin"
          boot=dsy_bootloader_v6_2-intdfu-2000ms.bin
          cp firmware/build/bass_multiband.bin "dist/${app}"
          cp "lib/HothouseExamples/libDaisy/core/${boot}" "dist/${boot}"
          cp lib/HothouseExamples/libDaisy/LICENSE dist/LICENSE-libDaisy.txt
          (cd dist && sha256sum "${app}" > "${app}.sha256" && sha256sum "${boot}" > "${boot}.sha256")

      - name: Attach the firmware to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bass_multiband-*.bin
            dist/bass_multiband-*.bin.sha256
            dist/dsy_bootloader_*.bin
            dist/dsy_bootloader_*.bin.sha256
            dist/LICENSE-libDaisy.txt
          generate_release_notes: true
