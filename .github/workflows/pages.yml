name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Pinned library revision
        id: libs
        run: echo "rev=$(git rev-parse HEAD:lib/HothouseExamples)" >> "$GITHUB_OUTPUT"

      - name: Cache libDaisy and DaisySP builds
        uses: actions/cache@v4
        with:
          path: |
            lib/HothouseExamples/libDaisy/build
            lib/HothouseExamples/DaisySP/build
          key: libs-${{ runner.os }}-${{ steps.libs.outputs.rev }}

      - name: Build libDaisy and DaisySP
        run: |
          make -C lib/HothouseExamples/libDaisy -j"$(nproc)"
          make -C lib/HothouseExamples/DaisySP -j"$(nproc)"

      - name: Release build (BM_DEV=0, BM_REMOTE=1, BOOT_SRAM)
        run: make -C firmware release

      # The web installer reads site/firmware/manifest.json (keys fixed by the
      # site's flasher): the program for the QSPI chip and the Daisy bootloader
      # for the internal flash. Same script as for local testing.
      - name: Publish the firmware with a manifest
        env:
          COMMIT: ${{ github.sha }}
        run: tools/site_firmware.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
