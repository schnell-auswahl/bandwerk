name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Pinned library revision
        id: libs
        run: echo "rev=$(git rev-parse HEAD:lib/HothouseExamples)" >> "$GITHUB_OUTPUT"

      - name: Cache libDaisy and DaisySP builds
        uses: actions/cache@v4
        with:
          path: |
            lib/HothouseExamples/libDaisy/build
            lib/HothouseExamples/DaisySP/build
          key: libs-${{ runner.os }}-${{ steps.libs.outputs.rev }}

      - name: Build libDaisy and DaisySP
        run: |
          make -C lib/HothouseExamples/libDaisy -j"$(nproc)"
          make -C lib/HothouseExamples/DaisySP -j"$(nproc)"

      - name: Release build (BM_DEV=0, BM_REMOTE=1, BOOT_SRAM)
        run: make -C firmware release

      # The web installer reads site/firmware/manifest.json (keys fixed by the
      # site's flasher): the program for the QSPI chip and the Daisy bootloader
      # for the internal flash. The version comes from firmware/version.h.
      - name: Publish the firmware with a manifest
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          out=site/firmware
          app=firmware/build/bass_multiband.bin
          boot=lib/HothouseExamples/libDaisy/core/dsy_bootloader_v6_2-intdfu-2000ms.bin
          mkdir -p "$out"
          cp "$app" "$out/bass_multiband.bin"
          cp "$boot" "$out/$(basename "$boot")"
          cp lib/HothouseExamples/libDaisy/LICENSE "$out/LICENSE-libDaisy.txt"  # MIT notice for the bootloader
          version="$(sed -n 's/^#define BM_FW_VERSION "\(.*\)"$/\1/p' firmware/version.h)"
          [ -n "$version" ] || { echo "BM_FW_VERSION not found in firmware/version.h"; exit 1; }
          boot_version="$(basename "$boot" | sed -n 's/^dsy_bootloader_v\([0-9]*\)_\([0-9]*\)-.*/\1.\2/p')"
          if command -v sha256sum >/dev/null; then sha() { sha256sum "$1" | cut -d' ' -f1; }
          else sha() { shasum -a 256 "$1" | cut -d' ' -f1; }; fi
          size() { wc -c < "$1" | tr -d ' '; }
          cat > "$out/manifest.json" <<MANIFEST
          { "name": "Hothouse Bass Multiband", "version": "${version}", "commit": "${COMMIT}",
            "app":        { "file": "bass_multiband.bin", "size": $(size "$out/bass_multiband.bin"), "sha256": "$(sha "$out/bass_multiband.bin")", "address": "0x90040000", "type": "boot_sram" },
            "bootloader": { "file": "$(basename "$boot")", "size": $(size "$boot"), "sha256": "$(sha "$boot")", "address": "0x08000000", "version": "${boot_version}", "license": "MIT (libDaisy)" } }
          MANIFEST
          python3 -m json.tool "$out/manifest.json"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
